<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#292721">
  <meta name="description" content="A private office scene with a spatial game menu.">
  <title>Repair Office</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <canvas id="scene" aria-label="Office. Click the 3D words to select, drag to look, R to reset." tabindex="0"></canvas>
  <div id="loading" role="status"><p id="load-message">Loading office...</p><progress id="progress" max="100" value="0"></progress></div>
  <nav id="accessible-menu" class="screen-reader-menu" aria-label="Game menu"></nav>
  <p id="announcement" class="sr-only" aria-live="polite"></p>
  <div id="tools"><button id="help-button" aria-label="Controls" aria-expanded="false">?</button><button id="enter-vr" hidden disabled>Enter VR</button></div>
  <aside id="help" hidden><p>Click a word to select. Drag to look.<br><kbd>R</kbd> reset &nbsp; <kbd>Esc</kbd> back</p><p>Quest: point and pull the trigger.</p><small id="xr-status"></small><small id="stats"></small></aside>
  <div id="toast" role="status" hidden></div>
  <div id="fatal" hidden role="alert"><p id="fatal-message"></p><button id="retry">Try again</button></div>
</body>
</html>
